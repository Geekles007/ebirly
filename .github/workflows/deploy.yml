name: Deploy portfolio to Hetzner

on:
  push:
    branches:
      - master
  # Permet de relancer un déploiement à la main, avec l'option "table rase".
  workflow_dispatch:
    inputs:
      clean:
        description: "Vider le dossier distant avant l'envoi (à n'utiliser qu'une fois, pour purger les anciens fichiers)"
        type: boolean
        default: false

permissions:
  contents: read

# Évite deux déploiements concurrents (annule le run précédent en cours).
concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (Next.js static export → ./out)
        run: yarn build

      # Garde-fou : un export vide ou un secret manquant fait échouer le job
      # AVANT de toucher au serveur, plutôt que d'écraser le site en ligne.
      - name: Check build output and secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "$FTP_SERVER" ]   || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

          [ -f ./out/index.html ] || { echo "::error::./out/index.html introuvable — le build n'a rien exporté."; exit 1; }

          echo "Fichiers à déployer : $(find ./out -type f | wc -l)"
          echo "Poids total         : $(du -sh ./out | cut -f1)"
          echo "Destination         : ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/public_html/' }}"

      # Diagnostic réseau : dit précisément ce qui coince (nom d'hôte ou port)
      # au lieu du "Timeout (control socket)" opaque de l'action.
      - name: Preflight FTP connectivity
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail

          # Un secret contenant "ftps://" ou un chemin est une erreur fréquente.
          host=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')
          if [ "$host" != "$FTP_SERVER" ]; then
            echo "::warning::FTP_SERVER contient un protocole, un port ou un chemin. N'y mettre que le nom d'hôte, par exemple wwwXXX.your-server.de"
          fi

          if getent hosts "$host" >/dev/null 2>&1; then
            echo "DNS : hôte résolu, $(getent hosts "$host" | wc -l) adresse(s)"
          else
            echo "::error::DNS : nom d'hôte introuvable. Corriger le secret FTP_SERVER."
            exit 1
          fi

          # Les runners GitHub sont en IPv4 : on teste explicitement l'IPv4.
          v4=$(getent ahostsv4 "$host" 2>/dev/null | awk '{print $1}' | head -1)
          if [ -z "$v4" ]; then
            echo "::error::Aucune adresse IPv4 pour cet hôte. Les runners GitHub ne sortent pas en IPv6."
            exit 1
          fi

          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$v4/$FTP_PORT" 2>/dev/null; then
            echo "TCP : connexion établie sur le port configuré"
          else
            echo "::error::TCP : aucune réponse sur le port configuré. Vérifier FTP_SERVER et FTP_PORT (21 pour du FTPS explicite, pas 22 qui est du SFTP)."
            exit 1
          fi

          # Dialogue FTPS réel : distingue un serveur muet d'un échec TLS
          # ou d'identifiants refusés. curl est préinstallé sur les runners.
          echo "FTPS : tentative de connexion et de listing…"
          if curl -4 --ssl-reqd --disable-epsv --connect-timeout 20 --max-time 45 \
                  --user "$FTP_USERNAME:$FTP_PASSWORD" \
                  "ftp://$host:$FTP_PORT/" --list-only -sS -o /tmp/ftp-listing.txt 2>/tmp/ftp-err.txt; then
            echo "FTPS : connexion et listing réussis, $(wc -l < /tmp/ftp-listing.txt) entrée(s) à la racine"
            sed 's/^/  /' /tmp/ftp-listing.txt | head -20
          else
            echo "::error::FTPS : le dialogue a échoué. Détail ci-dessous."
            sed 's/^/  /' /tmp/ftp-err.txt | head -10
            exit 1
          fi

      # L'action garde un fichier d'état (.ftp-deploy-sync-state.json) à la racine
      # distante : seuls les fichiers modifiés repartent à chaque déploiement.
      - name: Deploy to Hetzner via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Le serveur Hetzner IMPOSE le TLS explicite : une connexion en FTP
          # simple est rejetée par "550 SSL/TLS required on the control channel".
          # Ne pas repasser FTP_PROTOCOL à "ftp".
          protocol: ${{ secrets.FTP_PROTOCOL || vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          local-dir: ./out/
          # Racine web du compte Hetzner. Surchargeable par FTP_SERVER_DIR,
          # défini au choix en secret ou en variable de dépôt.
          server-dir: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/public_html/' }}
          # true uniquement via un lancement manuel : vide la destination
          # puis renvoie tout (utile pour purger les fichiers d'une ancienne version).
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean }}
          log-level: standard
          timeout: 60000
